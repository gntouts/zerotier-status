<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Status Dashboard</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2285%22>🤖</text></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Enable dark mode class-based
        tailwind.config = {
            darkMode: 'class'
        };
    </script>
</head>

<body class="bg-white text-gray-900 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-300">
    <div class="container mx-auto p-6">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-3xl font-bold">Device Status Dashboard</h1>
            <button id="theme-toggle" class="px-4 py-2 rounded bg-gray-800 text-white dark:bg-gray-200 dark:text-black">
                Toggle Dark Mode
            </button>
        </div>

        <div id="device-grid" class="grid gap-6 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4"></div>
    </div>

    <script>
        // Dark mode toggle
        const toggle = document.getElementById("theme-toggle");
        toggle.addEventListener("click", () => {
            document.documentElement.classList.toggle("dark");
        });

        async function fetchStatus() {
            try {
                const response = await fetch("/status");
                const data = await response.json();
                const grid = document.getElementById("device-grid");
                grid.innerHTML = ""; // Clear old cards

                Object.values(data).forEach(device => {
                    const card = document.createElement("div");
                    card.className =
                        "relative p-4 rounded-xl shadow-md bg-gray-100 dark:bg-gray-800";

                    const indicator = document.createElement("div");
                    indicator.className = `absolute top-4 right-4 w-3 h-3 rounded-full ${device.status === "online" ? "bg-green-500" : "bg-red-500"
                        }`;
                    card.appendChild(indicator);

                    card.innerHTML += `
            <div class="font-semibold text-lg mb-2">${device.name}</div>
            <div><span class="font-medium">Node ID:</span> ${device.node_id}</div>
            <div><span class="font-medium">Network ID:</span> ${device.network_id}</div>
            <div><span class="font-medium">Status:</span> ${device.status}</div>
            ${device.status === "offline"
                            ? `<div><span class="font-medium">Last Online:</span> ${new Date(
                                device.last_online
                            ).toLocaleString()}</div>`
                            : ""
                        }
          `;

                    grid.appendChild(card);
                });
            } catch (error) {
                console.error("Error fetching device status:", error);
            }
        }

        fetchStatus(); // Initial load
        setInterval(fetchStatus, 30000); // Poll every 30s
    </script>
</body>

</html>
